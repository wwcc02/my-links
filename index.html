<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>† Welcome to My Dark Castle †</title>
    <style>
        /* 1. 【全局基礎設定】 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000 !important;
            overflow: hidden;
            user-select: none;
            font-family: monospace;
            color: #ffffff;
            position: relative;
        }
        *, html, body, a, button, input, select, textarea {
            cursor: none !important;
        }

        /* 2. 【強制互動解鎖層 (用來突破瀏覽器自動播放限制)】 */
        #welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999999;
            cursor: pointer !important;
            transition: opacity 0.5s ease;
        }
        #welcome-overlay h1 {
            color: #ff3366;
            font-size: 2rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #ff0033;
            animation: retroBlink 1s infinite alternate;
        }
        #welcome-overlay p {
            color: #cccccc;
            font-size: 1rem;
            border: 1px dashed #ff3366;
            padding: 10px 20px;
            border-radius: 8px;
        }

        @keyframes retroBlink {
            from { opacity: 1; }
            to { opacity: 0.3; }
        }

        /* 3. 【其他主畫面排版與游標樣式】 */
        .main-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        h1.title {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #ff3366;
        }
        p.subtitle {
            font-size: 1.2rem;
            color: #888888;
        }

        /* 菱形游標 */
        #custom-cursor {
            position: fixed;
            width: 16px;
            height: 16px;
            background: #ff3366;
            transform: rotate(45deg);
            pointer-events: none;
            z-index: 1000000;
            box-shadow: 0 0 8px #ff3366;
            display: none;
        }
    </style>
</head>
<body>

    <!-- 點擊任意處解鎖音樂的遮罩層 -->
    <div id="welcome-overlay">
        <h1>† 歡迎來到黑暗城堡 †</h1>
        <p>[ 點擊任意處以解鎖音樂並進入 ]</p>
    </div>

    <!-- 自訂菱形游標 -->
    <div id="custom-cursor"></div>

    <!-- 背景音樂 (請確保你的音檔路徑正確，或直接替換 src 網址/檔名) -->
    <audio id="bgm" loop>
        <source src="music.mp3" type="audio/mpeg">
        您的瀏覽器不支援音樂播放標籤
    </audio>

    <div class="main-content">
        <h1 class="title">My Dark Castle</h1>
        <p class="subtitle">just my links, yah</p>
    </div>

    <script>
        // 游標跟隨邏輯
        const cursor = document.getElementById('custom-cursor');
        window.addEventListener('mousemove', (e) => {
            cursor.style.display = 'block';
            cursor.style.left = (e.clientX - 8) + 'px';
            cursor.style.top = (e.clientY - 8) + 'px';
        });

        // 點擊畫面任意處解鎖並播放音樂
        const overlay = document.getElementById('welcome-overlay');
        const bgm = document.getElementById('bgm');

        overlay.addEventListener('click', () => {
            bgm.play().then(() => {
                console.log("音樂播放成功！");
            }).catch(err => {
                console.log("播放失敗：", err);
            });

            // 淡出並移除遮罩層
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.remove();
            }, 500);
        });
    </script>
</body>
</html>
