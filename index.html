<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>† Welcome to My Dark Castle †</title>
    <style>
        /* 1. 【全局基礎設定】 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000 !important;
            overflow: hidden;
            user-select: none;
            font-family: monospace;
            color: #ffffff;
            position: relative;
        }
        /* 強制自訂游標覆蓋所有元素 */
        *, html, body, a, button, input, select, textarea {
            cursor: none !important;
        }

        /* 2. 【版面配置】 */
        .main-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
        }
        h1.title {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #ff3366;
            text-shadow: 0 0 10px #ff0033;
        }
        p.subtitle {
            font-size: 1.2rem;
            color: #888888;
            margin-bottom: 30px;
        }

        /* 3. 【YouTube 音樂播放器面板容器】 */
        .music-panel {
            background: rgba(20, 20, 20, 0.9);
            border: 2px solid #ffffff;
            padding: 15px;
            border-radius: 4px;
            width: 300px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
        }

        /* 4. 【菱形自訂游標】 */
        #custom-cursor {
            position: fixed;
            width: 16px;
            height: 16px;
            background: #ff3366;
            transform: rotate(45deg);
            pointer-events: none;
            z-index: 1000000;
            box-shadow: 0 0 8px #ff3366;
            display: none;
        }
    </style>
</head>
<body>

    <!-- 自訂菱形游標 -->
    <div id="custom-cursor"></div>

    <div class="main-content">
        <h1 class="title">My Dark Castle</h1>
        <p class="subtitle">just my links, yah</p>

        <!-- YouTube 音樂播放器控制面板 -->
        <div class="music-panel">
            <!-- 隱藏式 YouTube 音樂播放器容器 -->
            <div id="player" style="display:none;"></div>

            <!-- 儀式感控制按鈕 -->
            <div style="margin-top:5px;">
              <button id="musicToggle" onclick="toggleMusic()" 
                style="width:100%; font-size:16px; padding:6px 0; text-align:center; border:2px solid #000000; background:#ffffff; color:#000000; cursor:pointer;">
                ◇°•音×樂•°◆
              </button>
            </div>

            <!-- 播放進度條 -->
            <div style="margin:6px 0;">
              <input type="range" id="progressBar" value="0" min="0" max="100" step="1" 
                style="width:100%; height:6px; background:#ccc; accent-color:#000;" />
            </div>

            <!-- 音量調整拉條 + 靜音按鈕 -->
            <div style="margin:6px 0; display:flex; align-items:center; gap:8px;">
              <input type="range" id="volumeBar" value="50" min="0" max="100" step="1"
                style="flex:1; height:6px; background:#ccc; accent-color:#000;" />
              <span id="volumeValue" style="font-size:14px; color:#ffffff;">50%</span>
              <button id="muteToggle" onclick="toggleMute()" 
                style="font-size:14px; padding:4px 10px; border:2px solid #ffffff; background:#000000; color:#ffffff; cursor:pointer;">
                靜音
              </button>
            </div>

            <!-- 下拉式選單：選擇歌曲 -->
            <div style="margin-top:6px; text-align:center;">
              <select id="songSelector" onchange="changeSong()" style="width:100%; font-size:14px; padding:4px;">
                <option value="0">Gazette - Silly God Disco</option>
                <option value="1">Miyavi - Tome To Jurii</option>
                <option value="2">シド - アリバイ</option>
                <option value="3">ギルガメッシュ - crying rain</option>
                <option value="4">KAMIJO - 闇夜のライオン</option>
                <option value="5">LOG - Adore you～キミヲ想フ声～</option>
                <option value="6">Versailles - ASCENDEAD MASTER</option>
                <option value="7">the GazettE - SHIVER</option>
                <option value="8">KAMIJO - mademoiselle</option>
                <option value="9">ViViD - 「夢」〜ムゲンノカナタ〜</option>
                <option value="10">MIYAVI - Papa Mama</option>
              </select>
            </div>
        </div>
    </div>

    <script>
        // 1. 【自訂游標追蹤邏輯】
        const cursor = document.getElementById('custom-cursor');
        window.addEventListener('mousemove', (e) => {
            cursor.style.display = 'block';
            cursor.style.left = (e.clientX - 8) + 'px';
            cursor.style.top = (e.clientY - 8) + 'px';
        });

        // 2. 【YouTube 播放器核心邏輯】
        let player;
        let isPlaying = true;
        let currentIndex;
        let lastVolume = 50;
        let isMuted = false;

        const playlist = [
            "5kHXg0PTMzk","tl87LjR3910","gpxyLpwRrsk","OBKWCn9je-E","NXGi8A3iG60",
            "HP2RWTn2T8k","ilzoDGcKF9M","gdHO7yobgUk","UgYJ66i_rCo","fT4-R_8DmT0","sB_1nw1GMjg"
        ];

        currentIndex = Math.floor(Math.random() * playlist.length);

        let tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        let firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '0',
                width: '0',
                videoId: playlist[currentIndex],
                playerVars: { autoplay: 1, controls: 0, modestbranding: 1, rel: 0 },
                events: {
                    onReady: function () {
                        player.playVideo();
                        player.setVolume(50);
                        document.getElementById("volumeValue").textContent = "50%";
                        updateButtonStyle(true);
                        document.getElementById("songSelector").value = currentIndex;
                    },
                    onStateChange: function (event) {
                        if (event.data === YT.PlayerState.ENDED) {
                            currentIndex = (currentIndex + 1) % playlist.length;
                            player.loadVideoById(playlist[currentIndex]);
                            document.getElementById("songSelector").value = currentIndex;
                        }
                    }
                }
            });
        }

        function toggleMusic() {
            if (!player || typeof player.getPlayerState !== "function") return;
            let state = player.getPlayerState();
            if (state === YT.PlayerState.PLAYING) {
                player.pauseVideo();
                isPlaying = false;
            } else {
                player.playVideo();
                isPlaying = true;
            }
            updateButtonStyle(isPlaying);
        }

        function changeSong() {
            const index = parseInt(document.getElementById("songSelector").value);
            currentIndex = index;
            if (player && typeof player.loadVideoById === "function") {
                player.loadVideoById(playlist[index]);
                isPlaying = true;
                updateButtonStyle(true);
            }
        }

        function updateButtonStyle(playing) {
            const button = document.getElementById("musicToggle");
            if (playing) {
                button.style.background = "#000000";
                button.style.color = "#ffffff";
                button.style.border = "2px solid #ffffff";
            } else {
                button.style.background = "#ffffff";
                button.style.color = "#000000";
                button.style.border = "2px solid #000000";
            }
        }

        setInterval(() => {
            if (player && typeof player.getDuration === "function" && typeof player.getCurrentTime === "function") {
                const duration = player.getDuration();
                const current = player.getCurrentTime();
                if (duration && duration > 0) {
                    const progress = (current / duration) * 100;
                    document.getElementById("progressBar").value = progress || 0;
                }
            }
        }, 1000);

        document.getElementById("progressBar").addEventListener("input", function () {
            if (player && typeof player.seekTo === "function" && typeof player.getDuration === "function") {
                const duration = player.getDuration();
                if (duration && duration > 0) {
                    const seekTime = (this.value / 100) * duration;
                    player.seekTo(seekTime, true);
                }
            }
        });

        document.getElementById("volumeBar").addEventListener("input", function () {
            if (player && typeof player.setVolume === "function") {
                player.setVolume(this.value);
                document.getElementById("volumeValue").textContent = this.value + "%";
                lastVolume = this.value;
                if (this.value > 0) {
                    isMuted = false;
                    updateMuteButtonStyle(false);
                }
            }
        });

        function toggleMute() {
            if (player && typeof player.setVolume === "function") {
                if (!isMuted) {
                    lastVolume = player.getVolume();
                    player.setVolume(0);
                    document.getElementById("volumeBar").value = 0;
                    document.getElementById("volumeValue").textContent = "0%";
                    isMuted = true;
                    updateMuteButtonStyle(true);
                } else {
                    player.setVolume(lastVolume || 50);
                    document.getElementById("volumeBar").value = lastVolume || 50;
                    document.getElementById("volumeValue").textContent = (lastVolume || 50) + "%";
                    isMuted = false;
                    updateMuteButtonStyle(false);
                }
            }
        }

        function updateMuteButtonStyle(muted) {
            const muteButton = document.getElementById("muteToggle");
            if (muted) {
                muteButton.style.background = "#ffffff";
                muteButton.style.color = "#000000";
                muteButton.style.border = "2px solid #000000";
            } else {
                muteButton.style.background = "#000000";
                muteButton.style.color = "#ffffff";
                muteButton.style.border = "2px solid #ffffff";
            }
        }
    </script>
</body>
</html>
